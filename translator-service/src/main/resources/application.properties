# Application Configuration
quarkus.application.name=translator-service
quarkus.application.version=1.0.0

# HTTP Server
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.exposed-headers=Content-Disposition
quarkus.http.cors.access-control-max-age=24H

# Jakarta Security - Basic Authentication
quarkus.security.users.file.enabled=true
quarkus.security.users.file.plain-text=true
quarkus.security.users.file.users=users.properties
quarkus.security.users.file.roles=roles.properties
quarkus.http.auth.basic=true

# Google Gemini API
gemini.api.url=https://generativelanguage.googleapis.com
gemini.api.key=${GEMINI_API_KEY:your-gemini-api-key-here}
gemini.model=gemini-3.1-flash-lite

# REST Client for Gemini
quarkus.rest-client.gemini-api.url=${gemini.api.url}
quarkus.rest-client.gemini-api.scope=jakarta.inject.Singleton

# OpenAPI / Swagger UI
quarkus.smallrye-openapi.info-title=LLM Translator REST API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=RESTful Web Service for translating text to Moroccan Arabic Dialect (Darija) using Google Gemini LLM
quarkus.smallrye-openapi.info-contact-name=Prof. El Habib Nfaoui
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui

# Logging
quarkus.log.level=INFO
quarkus.log.console.enable=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

# Native image (optional for production)
quarkus.native.additional-build-args=-H:ReflectionConfigurationFiles=reflection-config.json
