<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Darija Translator</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <div class="app">

    <!-- ── Header ──────────────────────────────────────────────────────── -->
    <header class="header">
      <div class="header-left">
        <img src="icons/icon32.png" alt="Darija Translator" class="logo" />
        <div>
          <h1 class="title">Darija Translator</h1>
          <p class="subtitle">English → Moroccan Arabic</p>
        </div>
      </div>
      <button id="settingsBtn" class="icon-btn" title="Settings">⚙️</button>
    </header>

    <!-- ── Settings Panel ──────────────────────────────────────────────── -->
    <div id="settingsPanel" class="settings-panel hidden">
      <h2 class="settings-title">API Settings</h2>
      <div class="form-group">
        <label for="apiUrl">API URL</label>
        <input type="text" id="apiUrl" placeholder="http://localhost:8080/api/translate" />
      </div>
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="user" autocomplete="username" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="password" autocomplete="current-password" />
      </div>
      <div class="form-group">
        <label for="sourceLanguage">Source Language</label>
        <select id="sourceLanguage">
          <option value="English">English</option>
          <option value="French">French</option>
          <option value="Spanish">Spanish</option>
          <option value="Arabic (Modern Standard)">Arabic (Modern Standard)</option>
          <option value="German">German</option>
          <option value="Italian">Italian</option>
        </select>
      </div>
      <button id="saveSettings" class="btn btn-primary">💾 Save Settings</button>
      <div id="settingsSaved" class="alert alert-success hidden">Settings saved!</div>
    </div>

    <!-- ── Main Content ─────────────────────────────────────────────────── -->
    <main class="main">

      <!-- Source Text -->
      <div class="section">
        <div class="section-header">
          <label class="section-label" for="sourceText">Source Text</label>
          <div class="actions">
            <button id="voiceInputBtn" class="icon-btn" title="Voice Input (Speech Recognition)">🎤</button>
            <button id="clearBtn" class="icon-btn" title="Clear">🗑️</button>
          </div>
        </div>
        <textarea
          id="sourceText"
          class="textarea"
          placeholder="Enter text to translate, or right-click selected text on any page…"
          rows="6"
          aria-label="Text to translate"
        ></textarea>
        <div class="char-count"><span id="charCount">0</span> / 5000</div>
      </div>

      <!-- Translate Button -->
      <div class="translate-row">
        <div class="lang-badges">
          <span class="badge" id="sourceLangBadge">English</span>
          <span class="arrow">→</span>
          <span class="badge badge-target">Darija 🇲🇦</span>
        </div>
        <button id="translateBtn" class="btn btn-primary btn-lg">Translate</button>
      </div>

      <!-- Translation Output -->
      <div class="section">
        <div class="section-header">
          <label class="section-label">Translation (Darija)</label>
          <div class="actions">
            <button id="copyBtn" class="icon-btn" title="Copy translation">📋</button>
            <button id="speakBtn" class="icon-btn" title="Read aloud (Text-to-Speech)">🔊</button>
          </div>
        </div>
        <div id="translationOutput" class="output-box" dir="rtl" lang="ar">
          <span class="placeholder">Translation will appear here…</span>
        </div>
      </div>

      <!-- Status / Error / Loading -->
      <div id="statusBar" class="status-bar hidden">
        <span id="statusIcon"></span>
        <span id="statusMessage"></span>
      </div>

      <!-- Voice Status -->
      <div id="voiceStatus" class="voice-status hidden">
        🎙️ Listening… <span class="pulse"></span>
      </div>

      <!-- Translation Metadata -->
      <div id="metaBar" class="meta-bar hidden">
        <span id="metaModel"></span>
        <span id="metaTime"></span>
      </div>

    </main>

    <!-- ── History ──────────────────────────────────────────────────────── -->
    <section class="history-section">
      <div class="section-header">
        <span class="section-label">Recent Translations</span>
        <button id="clearHistoryBtn" class="icon-btn" title="Clear history">🗑️</button>
      </div>
      <div id="historyList" class="history-list">
        <p class="empty-state">No translations yet.</p>
      </div>
    </section>

  </div>

  <script src="sidepanel.js" type="module"></script>
</body>
</html>
